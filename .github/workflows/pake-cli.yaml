name: Build App With Pake CLI

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.26.2"

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        required: true
        default: "windows-latest"
        type: choice
        options:
          - "windows-latest"
          - "macos-latest"
          - "ubuntu-24.04"
      url:
        description: "Website URL"
        required: true
      name:
        description: "App name (lowercase for Linux)"
        required: true
      icon:
        description: "Icon URL, auto-fetch if empty"
        required: false
      width:
        description: "Window width (px)"
        required: false
        default: "1200"
      height:
        description: "Window height (px)"
        required: false
        default: "780"
      min_width:
        description: "Minimum window width (px)"
        required: false
      min_height:
        description: "Minimum window height (px)"
        required: false
      app_version:
        description: "App version"
        required: false
        default: "1.0.0"
      fullscreen:
        description: "Start in fullscreen mode"
        required: false
        type: boolean
        default: false
      hide_title_bar:
        description: "Hide title bar (macOS only)"
        required: false
        type: boolean
        default: false
      new_window:
        description: "Allow sites to open new windows"
        required: false
        type: boolean
        default: false
      multi_arch:
        description: "Universal binary (macOS only)"
        required: false
        type: boolean
        default: false
      targets:
        description: "Package formats (Linux only: deb,appimage,rpm,zst)"
        required: false
        default: "deb"

jobs:
  build:
    name: ${{ inputs.platform }}
    runs-on: ${{ inputs.platform }}
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Node.js Environment
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Build CLI
        run: pnpm run cli:build

      - name: Setup mold linker
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1

      - name: Rust cache restore
        uses: actions/cache/restore@v4
        id: cache_store
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-pake-${{ hashFiles('**/Cargo.lock') }}

      - name: Build App (Linux/macOS)
        if: runner.os != 'Windows'
        timeout-minutes: 25
        shell: bash
        run: |
          ARGS=("${{ inputs.url }}" "--name" "${{ inputs.name }}")

          if [ -n "${{ inputs.icon }}" ]; then
            ARGS+=("--icon" "${{ inputs.icon }}")
          fi

          if [ -n "${{ inputs.width }}" ]; then
            ARGS+=("--width" "${{ inputs.width }}")
          fi

          if [ -n "${{ inputs.height }}" ]; then
            ARGS+=("--height" "${{ inputs.height }}")
          fi

          if [ -n "${{ inputs.min_width }}" ]; then
            ARGS+=("--min-width" "${{ inputs.min_width }}")
          fi

          if [ -n "${{ inputs.min_height }}" ]; then
            ARGS+=("--min-height" "${{ inputs.min_height }}")
          fi

          if [ -n "${{ inputs.app_version }}" ]; then
            ARGS+=("--app-version" "${{ inputs.app_version }}")
          fi

          if [ "${{ inputs.fullscreen }}" == "true" ]; then
            ARGS+=("--fullscreen")
          fi

          if [ "${{ inputs.hide_title_bar }}" == "true" ]; then
            ARGS+=("--hide-title-bar")
          fi

          if [ "${{ inputs.new_window }}" == "true" ]; then
            ARGS+=("--new-window")
          fi

          if [ "${{ inputs.multi_arch }}" == "true" ]; then
            ARGS+=("--multi-arch")
          fi

          if [ -n "${{ inputs.targets }}" ] && [ "${{ runner.os }}" == "Linux" ]; then
            ARGS+=("--targets" "${{ inputs.targets }}")
          fi

          echo "Running: node dist/cli.js ${ARGS[@]}"
          node dist/cli.js "${ARGS[@]}"

      - name: Build App (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 25
        shell: pwsh
        run: |
          $pakeArgs = @("${{ inputs.url }}", "--name", "${{ inputs.name }}")

          if ("${{ inputs.icon }}" -ne "") {
            $pakeArgs += @("--icon", "${{ inputs.icon }}")
          }

          if ("${{ inputs.width }}" -ne "") {
            $pakeArgs += @("--width", "${{ inputs.width }}")
          }

          if ("${{ inputs.height }}" -ne "") {
            $pakeArgs += @("--height", "${{ inputs.height }}")
          }

          if ("${{ inputs.min_width }}" -ne "") {
            $pakeArgs += @("--min-width", "${{ inputs.min_width }}")
          }

          if ("${{ inputs.min_height }}" -ne "") {
            $pakeArgs += @("--min-height", "${{ inputs.min_height }}")
          }

          if ("${{ inputs.app_version }}" -ne "") {
            $pakeArgs += @("--app-version", "${{ inputs.app_version }}")
          }

          if ("${{ inputs.fullscreen }}" -eq "true") {
            $pakeArgs += "--fullscreen"
          }

          if ("${{ inputs.hide_title_bar }}" -eq "true") {
            $pakeArgs += "--hide-title-bar"
          }

          if ("${{ inputs.new_window }}" -eq "true") {
            $pakeArgs += "--new-window"
          }

          Write-Host "Running: node dist/cli.js $($pakeArgs -join ' ')"
          node dist/cli.js @pakeArgs

          git checkout -- src-tauri/Cargo.lock

          # 임시 폴더 초기화 (이전 캐시 잔여 파일 혼입 원천 차단)
          if (Test-Path output_portable) { Remove-Item -Recurse -Force output_portable }
          New-Item -ItemType Directory -Force -Path output_portable

          $rawName = "${{ inputs.name }}"
          $safeName = $rawName.Trim()

          # 인스톨러/시스템 캐시 폴더를 제외하고 방금 생성된 최신 바이너리 1개 추출
          $latestExe = Get-ChildItem -Path . -Recurse -Filter "*.exe" | Where-Object {
            $_.FullName -notmatch 'bundle|nsis|deps|build|\.cargo|node_modules'
          } | Sort-Object LastWriteTime -Descending | Select-Object -First 1

          if ($latestExe) {
            $destPath = Join-Path "output_portable" "$safeName.exe"
            Write-Host "Found build artifact: $($latestExe.FullName)"
            Write-Host "Renaming and copying to: $destPath"
            Copy-Item -Path $latestExe.FullName -Destination $destPath -Force
          } else {
            Write-Error "No valid standalone executable found!"
            exit 1
          }

      # --- 아티팩트 업로드 영역 ---

      # 수집된 단일 무설치 포터블 실행 파일 1개만 업로드
      - name: Upload Portable EXE (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-Windows-Portable
          path: output_portable/*.exe
          retention-days: 3
          if-no-files-found: error

      - name: Upload DMG (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-macOS
          path: ${{ inputs.name }}.dmg
          retention-days: 3

      - name: Upload DEB (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-Linux-deb
          path: ${{ inputs.name }}.deb
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload AppImage (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-Linux-AppImage
          path: ${{ inputs.name }}.AppImage
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload RPM (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-Linux-rpm
          path: ${{ inputs.name }}.rpm
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload ZST (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-Linux-zst
          path: ${{ inputs.name }}-*.pkg.tar.zst
          retention-days: 3
          if-no-files-found: ignore

      - name: Rust cache store
        uses: actions/cache/save@v4
        if: steps.cache_store.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-pake-${{ hashFiles('**/Cargo.lock') }}
