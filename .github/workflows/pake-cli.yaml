- name: Build App (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 25
        shell: pwsh
        run: |
          $pakeArgs = @("${{ inputs.url }}", "--name", "${{ inputs.name }}")

          if ("${{ inputs.icon }}" -ne "") {
            $pakeArgs += @("--icon", "${{ inputs.icon }}")
          }

          if ("${{ inputs.width }}" -ne "") {
            $pakeArgs += @("--width", "${{ inputs.width }}")
          }

          if ("${{ inputs.height }}" -ne "") {
            $pakeArgs += @("--height", "${{ inputs.height }}")
          }

          if ("${{ inputs.min_width }}" -ne "") {
            $pakeArgs += @("--min-width", "${{ inputs.min_width }}")
          }

          if ("${{ inputs.min_height }}" -ne "") {
            $pakeArgs += @("--min-height", "${{ inputs.min_height }}")
          }

          if ("${{ inputs.app_version }}" -ne "") {
            $pakeArgs += @("--app-version", "${{ inputs.app_version }}")
          }

          if ("${{ inputs.fullscreen }}" -eq "true") {
            $pakeArgs += "--fullscreen"
          }

          if ("${{ inputs.hide_title_bar }}" -eq "true") {
            $pakeArgs += "--hide-title-bar"
          }

          if ("${{ inputs.new_window }}" -eq "true") {
            $pakeArgs += "--new-window"
          }

          Write-Host "Running: node dist/cli.js $($pakeArgs -join ' ')"
          node dist/cli.js @pakeArgs

          git checkout -- src-tauri/Cargo.lock

          # 생성된 .exe 파일 위치 확인 (로그 출력용)
          Write-Host "=== Generated EXE Files ==="
          Get-ChildItem -Path . -Recurse -Filter "*.exe" | Select-Object FullName

      # 무설치 포터블 실행 파일 업로드 (루트 및 release 폴더 전체 검색)
      - name: Upload Portable EXE (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-Windows-Portable
          path: |
            *.exe
            dist/*.exe
            output/*.exe
            src-tauri/target/release/*.exe
            !src-tauri/target/release/build/
            !src-tauri/target/release/deps/
            !src-tauri/target/release/bundle/
          retention-days: 3
          if-no-files-found: error
